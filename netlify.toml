[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Express and Multer are CommonJS with dynamic requires, so they ship as real
  # node_modules rather than being inlined by the bundler.
  external_node_modules = ["express", "multer", "serverless-http", "@netlify/blobs"]

[functions.cleanup]
  schedule = "0 * * * *"

# The API and the short-link redirect are both served by the same function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/api/s/:splat"
  status = 200
  force = true

# Everything else is the single-page app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
